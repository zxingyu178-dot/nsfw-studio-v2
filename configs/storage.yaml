# 存储布局：相对 data_root 的子目录结构（Phase 0 规范 §九）
# 程序首次启动按此清单自动创建目录（幂等）
storage:
  database_filename: "studio.db"
  layout:
    - database
    # W4.1 统一图片资产根与缓存（新图片写入）
    - assets/images
    - cache
    - cache/thumbnails
    - cache/previews
    - cache/temp
    # 兼容旧结构（迁移验收前保留）
    - images/originals
    - images/upscaled
    - images/processed
    - images/thumbnails
    - images/previews
    - images/temp
    - assets/face
    - assets/clothing
    - assets/pose
    - assets/scene
    - imports
    - exports
    - cache
    - backups
    - logs/app
    - logs/jobs
    - logs/errors
