# NSFW Studio V2 公共配置（机器无关，随仓库分发）
#
# 本文件**不设置 DataRoot 路径**：不配置时使用可移植默认值
# %USERPROFILE%/NSFW-Studio-Data。
#
# 覆盖优先级（固定）：
#   1. 环境变量 NSFW_STUDIO_DATA_ROOT（最高）
#   2. configs/config.local.yaml —— 本机私有配置，已被 .gitignore，不提交 GitHub
#   3. 本文件（公共模板）
#   4. 代码默认值（用户目录）
#
# 本机想把数据放到其他盘：新建 configs/config.local.yaml 写入：
#   data_root: "<盘符>:/NSFW-Studio-Data"
# 并保持其不被提交——换电脑 clone 后无需任何修改即可启动。

# Mobile Review Bridge（局域网手机审核桥，Phase 0.13）。
# 安全红线：主 Studio 端口始终只听回环地址，绝不变；本 Bridge 独立端口 8877，
# 只暴露审核相关 API（健康/配对/图片/审核），绝不 include 生成/引擎/清理等模块。
# enabled=false 时 Studio 不自动拉起 Bridge；真机配置（是否启用、绑定地址）
# 写在 config.local.yaml，本公共模板只给机器无关的默认值。
mobile_review:
  enabled: false
  host: "0.0.0.0"
  port: 8877

# 受管 ComfyUI 运行时适配器选择（Phase 0.14 Runtime Closure）。
#   controlhub（默认，生产）：ComfyUI 生命周期唯一 owner 是 ControlHub 官方 lifecycle CLI
#     （integration_id=comfyui，固定端口 8188）；后端绝不自己拉起/杀进程树。
#   direct（仅 scripts/dev）：保留 v0.13.2 直接拉起 + uv 桩归属 + 健康探测/自恢复实现。
# 本机 ControlHub CLI 解释器与 --data-root 写在 config.local.yaml（含机器路径，不提交）。
engine_runtime:
  mode: controlhub
