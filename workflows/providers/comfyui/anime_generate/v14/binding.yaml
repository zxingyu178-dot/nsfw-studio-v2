# anime_generate v14 — ComfyUI Provider Binding（NoobAI-XL + Hires 二次采样）
#
# 在 v13 基础上新增 Hires 二次采样链路：
#   主采样（30 步 / dpmpp_2m / karras / cfg5）→ VAEDecode → ImageScaleBy(lanczos, 1.5x)
#   → VAEEncode → 二采 KSampler（12 步 / denoise 0.4）→ VAEDecode → SaveImage。
#
# 2026-11-25 实测（同 prompt 同 seed 832×1216 → 1248×1824）：
#   细节密度显著提升——衬衫蕾丝刺绣、发丝分层、窗边光斑、背景透视全部清晰；
#   单张 65s（v13 为 30–32s），批量出图时间约翻一倍。
#   未使用 4x-UltraSharp 先放大再缩小：6GB 显存下 4x 放大到 3328×4864 有 OOM 风险，
#   lanczos 直缩到 1.5x 的观感差异很小，稳定优先。
#
# 模型：NoobAI-XL v1.1（eps 版）。
# 提示词写法同 v13：质量前缀 + artist:torino_aqua/artist:kedama_milk + 官方短负向 + 防马赛克。

binding_version: v14
module: anime_generate
provider: comfyui
workflow_file: workflow.json

# 输出节点（SaveImage）：产物经 /view 取回并导入 DataRoot
save_image_node: "9"
save_image_prefix: "NSFWStudio/{job_short}/{stage}/{item_short}"

# 标准输入 → 节点注入位置
inputs:
  positive_prompt: {node: "5", field: "text"}
  negative_prompt: {node: "6", field: "text"}
  width:           {node: "4", field: "width"}
  height:          {node: "4", field: "height"}
  seed:            {node: "7", field: "seed"}

# 固定默认（本机实测；Module 标准输入不暴露）
defaults:
  "7":  {steps: 30, cfg: 5.0, sampler_name: dpmpp_2m, scheduler: karras, denoise: 1.0}
  "12": {steps: 12, cfg: 5.0, sampler_name: dpmpp_2m, scheduler: karras, denoise: 0.4}

# Seed 范围（KSampler 惯例）；二采节点 "12" 的 seed 固定于 workflow.json
seed_range: {min: 0, max: 2147483647}

capabilities:
  supports_negative_prompt: true
  output_size: explicit
  hires_fix: true          # v14 新增：1.5x 二次采样
  hires_scale: 1.5

requirements:
  comfyui_min_version: "0.37.0"
  nodes:
    - {class_type: CheckpointLoaderSimple, source: comfyui_core}
    - {class_type: CLIPTextEncode, source: comfyui_core}
    - {class_type: EmptyLatentImage, source: comfyui_core}
    - {class_type: KSampler, source: comfyui_core}
    - {class_type: VAEDecode, source: comfyui_core}
    - {class_type: ImageScaleBy, source: comfyui_core}
    - {class_type: VAEEncode, source: comfyui_core}
    - {class_type: SaveImage, source: comfyui_core}
  models:
    - {type: checkpoints, filename: NoobAI-XL-v1.1.safetensors, sha256: unverified, precision: fp16}

performance:
  status: measured
  batch_size: 1
  tested_hardware: {gpu: "RTX 3060 Laptop", vram_gb: 6, ram_gb: 16}
  tested_profiles:
    - {width: 832, height: 1216, out_width: 1248, out_height: 1824, steps: 30, cfg: 5.0, hires_steps: 12, hires_denoise: 0.4, sampler: dpmpp_2m, scheduler: karras, batch_size: 1, sampling_seconds: 65, source: "2026-11-25 本地直连 ComfyUI 实测"}
  notes: "单张约 65s（模型常驻），v13 为 30–32s；6GB 显存可跑，未 OOM"
