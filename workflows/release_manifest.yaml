schema_version: 1
# 工作流正式放行清单（W1-1 / W1.1-3）
#
# 状态语义：
#   dependencies_ready        节点/模型依赖是否齐全（W1 由人工登记；W2 改为实际探测）
#   real_gate_passed          是否已有该 binding 的真实 G3 Studio 出图证据
#   hardware_status           normal | slow | experimental | unsupported
#   default_profile_verified  当前默认分辨率/步数是否有对应 G4 证据（独立语义，不参与放行）
#   ready_to_run              由 registered + binding_valid + dependencies_ready +
#                             real_gate_passed + hardware_status != unsupported 计算
#
# 证据三分法（不得混写）：
#   comfyui_node_chain         直接 ComfyUI API / 节点链出图
#   studio_production          经 Studio Job + Queue + Stage 的完整生产链
#   default_profile_performance 当前默认配置的性能测量（G4）
#
# 数据来源：只读审计 D:/NSFW-Studio-Data/database/studio.db（2026-10-30）。
# 禁止把模型文件大小或估算值写成实测性能；缺证据必须 false/unverified。

modules:
  basic_generate:
    bindings:
      v1:
        dependencies_ready: true
        real_gate_passed: true
        hardware_status: normal
        default_profile_verified: false
        notes: "Qwen-Image 2.1 UC Q4 + Turbo8 + f23gg，8 步；主力文生图"
        evidence:
          comfyui_node_chain:
            status: passed
            method: "nightbatch 批量 + 多次真实出图"
          studio_production:
            status: passed
            binding_hash: "6c1a64481fc4802e"
            completed_stages: 69
            method: "Studio Job/Queue/Stage 完整链（只读审计 studio.db）"
          default_profile_performance:
            status: unverified
            reason: "Turbo8 双 LoRA 默认档未做独立 G4 峰值/耗时记录"

  img2img:
