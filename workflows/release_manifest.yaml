schema_version: 1
# 工作流正式放行清单（W1-1 / W1.1-3；W4.0 收敛）
#
# 状态语义：
#   dependencies_ready        节点/模型依赖是否齐全（W2 起以实际探测为准）
#   real_gate_passed          是否已有该 binding 的真实 G3 Studio 出图证据
#   hardware_status           normal | slow | experimental | unsupported
#   default_profile_verified  当前默认分辨率/步数是否有对应 G4 证据（独立语义，不参与放行）
#   ready_to_run              由 registered + binding_valid + dependencies_ready +
#                             real_gate_passed + hardware_status != unsupported 计算
#
# 证据三分法（不得混写）：
#   comfyui_node_chain / studio_production / default_profile_performance
#
# W4.0：正式模块收敛为四个（basic/anime/img2img/reference），upscale 已下线；
# 新版本（basic v2 / anime v2 / img2img v3 / reference v2）只有在完成依赖探测与
# 真实 Studio G3 后才允许把 evidence 写为 passed，不得沿用旧版本证据。

