schema_version: 1
# 工作流正式放行清单（W1-1 / W1.1-3；W4.0 收敛）
#
# 状态语义：
#   dependencies_ready        节点/模型依赖是否齐全（W2 起以实际探测为准）
#   real_gate_passed          是否已有该 binding 的真实 G3 Studio 出图证据
#   hardware_status           normal | slow | experimental | unsupported
#   default_profile_verified  当前默认分辨率/步数是否有对应 G4 证据（独立语义，不参与放行）
#   ready_to_run              由 registered + binding_valid + dependencies_ready +
#                             real_gate_passed + hardware_status != unsupported 计算
#
# 证据三分法（不得混写）：
#   comfyui_node_chain / studio_production / default_profile_performance
#
# W4.0：正式模块收敛为四个（basic/anime/img2img/reference），upscale 已下线；
# 新版本（basic v2 / anime v2 / img2img v3 / reference v2）只有在完成依赖探测与
# 真实 Studio G3 后才允许把 evidence 写为 passed，不得沿用旧版本证据。

modules:
  basic_generate:
    bindings:
      v1:
        frozen: true
        dependencies_ready: true
        real_gate_passed: true
        hardware_status: normal
        default_profile_verified: false
        notes: "冻结历史版本（8 步 turbo，qwen_image_2.1_vae）；仅历史 Job 引用"
        evidence:
          comfyui_node_chain:
            status: passed
            method: "nightbatch 批量 + 多次真实出图"
          studio_production:
            status: passed
            binding_hash: "6c1a64481fc4802e"
            completed_stages: 69
            method: "Studio Job/Queue/Stage 完整链（只读审计 studio.db）"
          default_profile_performance:
            status: unverified
            reason: "Turbo8 双 LoRA 默认档未做独立 G4 峰值/耗时记录"
      v2:
        dependencies_ready: false
        real_gate_passed: false
        hardware_status: normal
        default_profile_verified: false
        notes: "W4.0 默认版本：texture-fix VAE + 12 步 turbo；待依赖探测与真实 G3"
        evidence:
          comfyui_node_chain: {status: pending, method: "W4.0 G0 探测待执行"}
          studio_production: {status: pending, method: "W4.0 G3 真实 Job 待执行"}
